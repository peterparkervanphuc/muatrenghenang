# ===================================
# Arkanoid Game - Configuration
# ===================================
# Updated: November 6, 2025

# ============ Window Settings ============
window.width=800
window.height=600
window.title=Arkanoid Game - Java OOP Project
window.resizable=false

# ============ Game Settings ============
game.initial.lives=5
game.max.level=18
game.fps=60

# ============ Ball Settings ============
ball.speed.initial=5.0
ball.speed.max=10.0
ball.size=16
ball.radius=8
# Speed increases 7% per level, capped at 70% (level 11+)
ball.speed.bonus.per.level=0.07
ball.speed.bonus.max=0.7

# ============ Paddle Settings ============
paddle.width.normal=80
paddle.width.enlarged=120
paddle.height=20
paddle.speed=8
paddle.laser.cooldown=300

# ============ Brick Settings ============
brick.width=60
brick.height=20
# Moving brick speed
brick.moving.speed=1.5

# ============ Powerup Settings ============
powerup.drop.chance=0.45
powerup.width=40
powerup.height=20
powerup.fall.speed=3
# Durations (milliseconds)
powerup.laser.duration=20000
powerup.slow.duration=10000

# ============ Combo System ============
combo.timeout=1000
combo.tier1.hits=5
combo.tier1.multiplier=2
combo.tier2.hits=10
combo.tier2.multiplier=3
combo.tier3.hits=15
combo.tier3.multiplier=4
combo.tier4.hits=20
combo.tier4.multiplier=5

# ============ Laser Settings ============
laser.width=4
laser.height=15
laser.speed=10

# ============ Scoring Points ============
# 8 regular bricks
score.brick.white=50
score.brick.orange=60
score.brick.lightblue=70
score.brick.green=80
score.brick.red=90
score.brick.blue=100
score.brick.purple=110
score.brick.yellow=120
# Special bricks
score.brick.silver=150
score.brick.gold=0
score.brick.moving=100

# ============ Sound Settings ============
sound.enabled=true

# ============ High Scores ============
highscore.max.entries=10
highscore.file=High Scores/High Scores.txt

# ============ Save Game ============
save.directory=Saves/
save.slots=3

# ============ Assets Paths ============
assets.backgrounds=Backgrounds/
assets.sprites=Sprites/
assets.sounds=Sounds/
assets.fonts=Fonts/

# ============ Debug Settings ============
debug.mode=false
debug.show.fps=false
debug.show.collision.boxes=false

