# Arkanoid Game Configuration

# Window Settings
window.width=800
window.height=600
window.title=Arkanoid Game
window.resizable=false

# Game Settings
game.initial.lives=3
game.max.level=5
game.fps=60

# Ball Settings
ball.speed.initial=5
ball.speed.max=10
ball.size=10

# Paddle Settings
paddle.width=100
paddle.height=20
paddle.speed=8
paddle.enlarged.width=150

# Powerup Settings
powerup.drop.chance=0.45
powerup.fall.speed=2
powerup.laser.duration=15
powerup.slow.duration=10

# Scoring (9 brick types)
score.brick.white=50
score.brick.orange=60
score.brick.lightblue=70
score.brick.green=80
score.brick.red=90
score.brick.blue=100
score.brick.purple=110
score.brick.yellow=120
score.brick.silver=50

# Sound Settings
sound.enabled=true

# High Scores
highscore.max.entries=10
highscore.file=High Scores/High Scores.txt

# Assets Paths
assets.backgrounds=Backgrounds/
assets.sprites=Sprites/
assets.sounds=Sounds/
assets.fonts=Fonts/

